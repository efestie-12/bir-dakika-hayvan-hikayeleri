# 3D sahne render testi: Claude KULLANMAZ (kota harcamaz).
# "scene3d" alanlı bir hikâyeyi (varsayılan examples/scene3d-demo) tam render eder, mp4'ü Telegram'a gönderir ve
# artifact olarak (3 gün) saklar. Log'daki "3d:" satırları 3D adım süresini, "ses:" satırı kullanılan sesi,
# "images: N/M" satırı üretilen yapay zekâ görsellerini ("visual": "image" hikâyelerde, Cloudflare FLUX) yazar.
# Elle çalıştır: Actions -> 3D sahne render testi.
name: 3D sahne render testi

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'story.json yolu (examples/<slug>/story.json ya da stories/<slug>/story.json)'
        type: string
        default: 'examples/scene3d-demo/story.json'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TR_VOICE_DIR: /home/runner/tts
      TZ: Europe/Istanbul
      PYTHONUNBUFFERED: '1'
      STORY: ${{ inputs.story }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hikâye girdisini doğrula
        run: |
          if ! [[ "$STORY" =~ ^(examples|stories)/[a-z0-9-]+/story\.json$ ]]; then
            echo "Geçersiz yol: examples/<slug>/story.json ya da stories/<slug>/story.json olmalı (slug: a-z, 0-9, tire)." >&2
            exit 1
          fi
          test -f "$STORY" || { echo "Bulunamadı: $STORY" >&2; exit 1; }
          SLUG="$(basename "$(dirname "$STORY")")"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "Hikâye: $STORY (slug: $SLUG)"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-3d.txt

      - name: ffmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Python paketlerini kur
        run: |
          pip install -r requirements.txt -r requirements-3d.txt
          pip show playwright | grep -i '^version' || true

      - name: Tarayıcı (Chrome ya da Playwright Chromium)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Sistem Chrome'u kullanılacak: $(google-chrome --version)"
          else
            echo "google-chrome yok; Playwright Chromium kuruluyor"
            python -m playwright install --with-deps chromium
          fi

      - name: Ses modeli önbelleği
        uses: actions/cache@v4
        with:
          path: /home/runner/tts
          key: voice-v1

      - name: Türkçe Piper seslerini indir (yedek; önbellekte yoksa)
        run: |
          for v in fahrettin dfki fettah; do bash scripts/fetch_voice.sh "$v" >/dev/null; done
          ls "$TR_VOICE_DIR"

      - name: Motor kontrolü
        run: python -c "import engine.build, engine.scene, engine.scene3d; print('motor OK')"

      - name: Videoyu üret (tam render, 3D)
        env:
          BD_IMAGES: '1'           # "visual": "image" hikâyelerde yapay zekâ görselleri (Cloudflare FLUX) üretilir
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BD_3D_BUDGET_S: '2100'   # ~15-19 sn 3D (≈500-570 kare × ~2,5-3 sn) varsayılan 1500 sn'yi aşabilir
        run: |
          set -o pipefail
          START=$(date +%s)
          python -m engine.build "$STORY" --out "out/$SLUG.mp4" --workers 3 | tee "$RUNNER_TEMP/build.log"
          echo "---- özet ----"
          grep '^ses:' "$RUNNER_TEMP/build.log" || true
          grep '^3d:' "$RUNNER_TEMP/build.log" || true
          grep -E '^ *images:' "$RUNNER_TEMP/build.log" || true
          IMGDIR="work/$SLUG/images"
          if [ -d "$IMGDIR" ]; then
            echo "görsel dosyaları ($IMGDIR): $(ls "$IMGDIR"/*.jpg 2>/dev/null | wc -l) adet"
            ls -la "$IMGDIR"/*.jpg 2>/dev/null || true
            python -c "import json,sys; r=json.load(open(sys.argv[1])); print('görsel raporu: kullanılan', r.get('used'), '/', r.get('scenes'), '·', r.get('counts'), '· tümü çizime düştü:', r.get('fallback_all'), '·', r.get('seconds'), 'sn'); [print('  sahne', d.get('scene'), d.get('id'), '->', d.get('provider'), d.get('file') or '') for d in r.get('details', [])]" "$IMGDIR/report.json" 2>/dev/null || echo "görsel raporu yok"
          else
            echo "görsel klasörü yok (hikâye görselsiz ya da görseller kapalı)"
          fi
          echo "build toplam: $(( $(date +%s) - START )) sn"
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:format=duration -of compact "out/$SLUG.mp4"

      - name: Videoyu artifact olarak sakla (3 gün)
        uses: actions/upload-artifact@v4
        with:
          name: scene3d-render
          path: out/${{ env.SLUG }}.mp4
          retention-days: 3

      - name: Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secret'ları tanımlı değil; gönderim atlandı (video artifact'ta)."
            exit 0
          fi
          USED=$(grep '^ses:' "$RUNNER_TEMP/build.log" | tail -1)
          D3=$(grep '^3d: toplam' "$RUNNER_TEMP/build.log" | tail -1)
          IMG=$(grep -E '^images:' "$RUNNER_TEMP/build.log" | tail -1)
          NOTE="🧊 3D sahne testi · $D3 · $USED"
          if [ -n "$IMG" ]; then NOTE="$NOTE · 🖼 $IMG"; fi
          REP="work/$SLUG/images/report.json"
          if [ -f "$REP" ] && python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('used', 0) > 0 else 1)" "$REP"; then
            NOTE="$NOTE · Yapay zekâ görselleri var: Studio'da \"Değiştirilmiş içerik: Evet\" işaretle"
          fi
          python scripts/deliver_telegram.py "$STORY" "out/$SLUG.mp4" --note "$NOTE"
